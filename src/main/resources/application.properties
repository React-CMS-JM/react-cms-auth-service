quarkus.application.name=react-cms-auth-service
# Cloud Run injects PORT; local runs use HTTP_PORT from .env (default 8081)
quarkus.http.port=${PORT:${HTTP_PORT:8081}}

# Datasource (schema owned by SQL scripts)
# TLS is verified against the JVM truststore (cacerts), which already contains
# the ISRG Root X1 CA used by TiDB Cloud — no PEM file needs to be mounted.
# Local: DB_SSL_MODE=PREFERRED (plain MySQL). Production (TiDB): DB_SSL_MODE=VERIFY_IDENTITY.
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USER:}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:react_cms}?sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=UTC

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.packages=com.reactcms.auth.entity
quarkus.hibernate-orm.log.sql=false

# Jackson camelCase + ISO dates (matches frontend)
quarkus.jackson.write-dates-as-timestamps=false

# CORS (comma-separated; production adds the frontend origin via CORS_ORIGINS)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH

# JWT HS256 — verification needs a JWK; signing uses JWT_SECRET (JwtService.signWithSecret).
# Local: run scripts/generate-jwt-jwk.ps1 (writes classpath jwt-secret.jwk, gitignored).
# Container: docker-entrypoint.sh builds file:/tmp/jwt-secret.jwk from JWT_SECRET (or use JWT_JWK_PATH).
# JWT_ISSUER must be identical in all 3 services (content/courses verify auth's tokens).
mp.jwt.verify.issuer=${JWT_ISSUER:https://react-cms.local/auth}
smallrye.jwt.verify.algorithm=HS256
smallrye.jwt.verify.key.location=${JWT_JWK_PATH:jwt-secret.jwk}
smallrye.jwt.token.kid=react-cms-hs256
smallrye.jwt.new-token.lifespan=${JWT_LIFESPAN:3600}
smallrye.jwt.new-token.kid=react-cms-hs256
react-cms.jwt.hmac-secret=${JWT_SECRET:change-me}

# OpenAPI / Swagger UI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.info-title=React CMS Auth Service
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# HTTP security policies
quarkus.http.auth.permission.public.paths=/api/auth/login,/api/auth/health,/q/*
quarkus.http.auth.permission.public.policy=permit

quarkus.http.auth.permission.authenticated.paths=/api/users*,/api/roles*,/api/permissions*,/api/auth/me,/api/auth/logout
quarkus.http.auth.permission.authenticated.policy=authenticated
