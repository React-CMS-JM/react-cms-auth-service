quarkus.application.name=react-cms-auth-service
quarkus.http.port=8081

# Datasource (schema owned by SQL scripts)
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USER:}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.url=jdbc:mysql://${DB_HOST:}:${DB_PORT:}/${DB_NAME:}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.packages=com.reactcms.auth.entity
quarkus.hibernate-orm.log.sql=false

# Jackson camelCase + ISO dates (matches frontend)
quarkus.jackson.write-dates-as-timestamps=false

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:3000
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH

# JWT HS256 — verification requires a JWK (plain strings in verify.secretkey are not used as raw HMAC secrets).
# Signing uses the matching UTF-8 secret via JwtService.signWithSecret (react-cms.jwt.hmac-secret).
mp.jwt.verify.issuer=https://react-cms.local/auth
smallrye.jwt.verify.algorithm=HS256
smallrye.jwt.verify.key.location=jwt-secret.jwk
smallrye.jwt.new-token.lifespan=3600
react-cms.jwt.hmac-secret=${JWT_SECRET:change-me}

# OpenAPI / Swagger UI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.info-title=React CMS Auth Service
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# HTTP security policies
quarkus.http.auth.permission.public.paths=/api/auth/login,/api/auth/health,/q/*
quarkus.http.auth.permission.public.policy=permit

quarkus.http.auth.permission.authenticated.paths=/api/users*,/api/roles*,/api/permissions*,/api/auth/me,/api/auth/logout
quarkus.http.auth.permission.authenticated.policy=authenticated
